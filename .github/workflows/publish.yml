# 通过 Tag 自动发布到 npm:
#   npm version <patch|minor|major>   # 产生版本提交 + v* tag
#   git push origin master --follow-tags
# tag 推送后本 workflow 自动: 校验 tag 与 package.json 版本一致 → npm run verify →
# npm publish(带 provenance)→ 创建 GitHub Release。
#
# 前置条件: npmjs.com 上给 @qlee/dockhand-cli 配置 Trusted Publisher,指向
# 本仓库(li-qiang/dockhand-cli)和本 workflow 文件(publish.yml)。
# 发布走 GitHub OIDC,不需要任何 NPM_TOKEN secret;npm CLI >= 11.5.1(Node 24)。

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance(OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm >= 11.5.1 才支持 trusted publishing(OIDC)
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (${TAG_VERSION}) 与 package.json 版本 (${PKG_VERSION}) 不一致"
            exit 1
          fi

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Verify (audit + generate --check + test)
        run: npm run verify

      - name: Show tarball contents
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
